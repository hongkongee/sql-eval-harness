# 스키마(OMOP-CDM) 키워드 사전 - pyahocorasick 최장 일치 매칭용.
#
# 예전엔 app/config/schema_terms.yaml(테이블/컬럼 매핑 방식)이 따로 있었지만
# 2026-09-27에 폐기하고 이 사전 하나로 통합했다. table/column 매핑은 이 서비스가
# 아니라 다운스트림 스키마 RAG의 역할이라는 게 확인된 설계 방향이기 때문이다
# (이 레포 안에 table/column을 실제로 소비하는 코드가 없었음 - app/core/
# keyword_extraction.py의 _trim_schema_overlap()도 start/end만 쓰고 table/column은
# 안 씀).
#
# ⚠️ 대표 키워드는 사람이 사전을 읽고 관리하기 위한 분류일 뿐이다 - API 출력
# (schema_keywords)에는 이 대표 키워드가 아니라 실제로 매칭된 표면형이 원문 그대로
# 나간다(2026-09-27 결정). "검사"를 대표 키워드 "측정"으로 미리 정규화해버리면,
# 그 검사가 실제로는 measurement가 아니라 procedure("내시경 검사")로 가야 하는
# 경우를 다운스트림 스키마 RAG가 원문 맥락으로 판단할 기회를 이 모듈이 미리
# 없애버리게 된다 - 원문 -> 대표 키워드 변환은 되돌릴 수 없기 때문이다. 그래서
# 이 사전은 매칭에만 쓰이고, 대표 키워드 자체는 API 응답에 노출되지 않는다.
#
# 구조: {대표 키워드(사전 관리용 분류): [문장에 나올 수 있는 표면형들]}
# 코드 수정 없이 이 파일만 고치면 반영된다 (단, app/core/schema_keyword_matcher.py가
# 프로세스 안에서 automaton을 캐시하므로 재시작은 필요).
#
# 형태소 분석기를 안 쓰고 순수 문자열 부분일치라서 "처방받은", "진단된"도 어간
# "처방"/"진단"을 포함하고 있으면 그대로 잡힌다.
#
# ## schema_terms.yaml에서 병합해온 표면형 (구 스키마 사전 폐기, 2026-09-27)
# schema_terms.yaml이 이미 같은 테이블 그룹으로 묶어놨던 표면형을 그대로 이어받아
# 병합했다: 진단명/질환/질병명/병명 -> 진단, 검사결과 -> 측정값, 연세 -> 연령,
# 피험자 -> 환자, 입원/방문일 -> 방문.
#
# ## 의도적으로 병합하지 않은 것
# - "시행": procedure_occurrence 표면형이었지만 "검사 시행", "투약 시행"처럼 다른
#   도메인 문장에서도 흔히 쓰이는 범용 동작 명사라, "시술"로 병합하면 그런 문장에서
#   오탐을 만든다. 사전에서 제외했다 (예: "검사 시행 기록이 있는 환자"에서 "시술"이
#   나오면 안 됨 - tests/test_schema_keyword_matcher.py 참고).
#
# ## 새로 분리한 대표 키워드
# - "생년월일": 기존엔 person 테이블 아래 "환자"/"연령"과 뭉뚱그려 있었지만, "연령"
#   (year_of_birth 기반 나이 비교)과는 의미가 다르다. 지금 분리해두면 나중에 필요할
#   때 다시 합칠 수 있지만, 처음부터 합쳐두면 나중에 나누기 어렵다.
#
# ## 알려진 오탐 위험
# - "진단"으로 병합한 "질환"은 "만성 신장 질환", "관상동맥질환"처럼 실제 concept
#   이름(질병명) 안에 흔히 포함되는 접미사라서, GLiNER가 concept로 잡은 span
#   안쪽의 "질환"에도 스키마 키워드가 별도로 매칭될 수 있다. 이번 작업 범위에서는
#   concept span으로 마스킹해서 걸러내지 않기로 했다 (두 결과가 겹치는 것 자체는
#   허용 - 스키마 키워드는 "이 문장에 어느 테이블이 관련되는지"를 알려주는 용도라
#   concept 안에 포함돼 있어도 정보로서는 여전히 유효함).
# - 한 글자 표면형("값")은 다른 문맥에서 오탐 위험이 가장 크다. 사전에 한 글자
#   항목을 추가할 땐 특히 주의할 것.

